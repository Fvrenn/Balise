services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: balise-app
    restart: unless-stopped
    ports:
      - "3004:3000"
    environment:
      - NODE_ENV=production
    env_file:
      - .env.production
    depends_on:
      - redis
    mem_limit: 1g
    networks:
      - balise-network

  redis:
    image: redis:7-alpine
    container_name: balise-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    mem_limit: 128m
    networks:
      - balise-network

  backup:
    image: alpine:3.19
    container_name: balise-backup
    restart: unless-stopped
    environment:
      - PGPASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_NAME=${DB_NAME}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh
    entrypoint: >
      sh -c "apk add --no-cache postgresql-client && 
             crond -f -d 8"
    networks:
      - balise-network
    mem_limit: 64m

volumes:
  redis_data:

networks:
  balise-network:
    driver: bridge
